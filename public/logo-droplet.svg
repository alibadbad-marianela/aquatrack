<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Background glow filter -->
    <filter id="aquaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Ocean Blue to Aqua to Cyan Gradient -->
    <linearGradient id="dropletGradient" x1="64" y1="12" x2="64" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="45%" stop-color="#1677E8" />
      <stop offset="100%" stop-color="#0E4A9E" />
    </linearGradient>

    <!-- Inner Luminous Highlight Gradient -->
    <linearGradient id="innerGlow" x1="48" y1="24" x2="80" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#2DD4BF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1677E8" stop-opacity="0" />
    </linearGradient>

    <!-- Glass Surface Specular Gradient -->
    <linearGradient id="specularGlint" x1="40" y1="20" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Ripple rings at base -->
  <ellipse cx="64" cy="112" rx="44" ry="10" stroke="#22D3EE" stroke-opacity="0.25" stroke-width="1.5" />
  <ellipse cx="64" cy="112" rx="28" ry="6.5" stroke="#2DD4BF" stroke-opacity="0.45" stroke-width="1.5" />

  <!-- Outer aura glow droplet -->
  <path d="M64 16 C64 16, 24 64, 24 88 C24 105.673 38.327 116 64 116 C89.673 116 104 105.673 104 88 C104 64 64 16 64 16 Z"
        fill="#22D3EE" opacity="0.2" filter="url(#aquaGlow)" />

  <!-- Primary Droplet Body -->
  <path d="M64 18 C64 18, 28 64, 28 88 C28 104.5 41.5 114 64 114 C86.5 114 100 104.5 100 88 C100 64 64 18 64 18 Z"
        fill="url(#dropletGradient)" />

  <!-- Internal Water Flow Ripple Arc -->
  <path d="M42 86 C46 96 54 102 64 102 C74 102 82 96 86 86"
        stroke="#2DD4BF" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />

  <!-- Secondary Inner Wave Curve -->
  <path d="M48 76 C52 82 58 85 64 85 C70 85 76 82 80 76"
        stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.4" />

  <!-- Inner Soft Light Fill -->
  <path d="M64 24 C64 24, 34 66, 34 88 C34 98 44 106 64 106 C84 106 94 98 94 88 C94 66 64 24 64 24 Z"
        fill="url(#innerGlow)" />

  <!-- Glass Specular Highlight (Curved teardrop glint on left) -->
  <path d="M62 26 C62 26, 38 64, 38 82 C38 88 40 92 44 94 C42 88 42 76 52 56 C57 46 62 34 62 26 Z"
        fill="url(#specularGlint)" />

  <!-- Small Top Right Shimmer Star -->
  <circle cx="74" cy="46" r="2.5" fill="#FFFFFF" opacity="0.75" />
</svg>
